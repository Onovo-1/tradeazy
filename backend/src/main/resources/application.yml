spring:
  application:
    name: tradeazy-backend

  datasource:
    # Use Railway's exact variable names
    url: jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQLUSER}
    password: ${MYSQLPASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-long-enough-for-hmac-sha-256-algorithm-12345}
  expiration-ms: 86400000

tradeazy:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  seed:
    admin:
      username: ${ADMIN_USERNAME:superadmin}
      email: ${ADMIN_EMAIL:admin@tradeazy.test}
      phone: ${ADMIN_PHONE:+2348000000000}
      password: ${ADMIN_PASSWORD:AdminPass123}
      first-name: Tradeazy
      last-name: Admin

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: WARN