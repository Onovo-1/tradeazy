spring:
  application:
    name: tradeazy-backend

  datasource:
    # On Railway, the MySQL plugin's MYSQLHOST/MYSQLPORT/MYSQLDATABASE/MYSQLUSER/MYSQLPASSWORD
    # variables are picked up automatically. Locally, the localhost defaults apply.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:tradeazy_db}?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Africa/Lagos&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:${MYSQLUSER:tradeazy_user}}
    password: ${SPRING_DATASOURCE_PASSWORD:${MYSQLPASSWORD:TradeazyDev@123}}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-that-is-long-enough-for-hmac-sha-256-algorithm-12345}
  expiration-ms: 86400000

tradeazy:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: ${CORS_ORIGINS:*}
  seed:
    admin:
      username: ${ADMIN_USERNAME:superadmin}
      email: ${ADMIN_EMAIL:admin@tradeazy.test}
      phone: ${ADMIN_PHONE:+2348000000000}
      password: ${ADMIN_PASSWORD:AdminPass123}
      first-name: Tradeazy
      last-name: Admin

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: WARN