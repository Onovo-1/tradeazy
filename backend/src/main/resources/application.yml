spring:
  application:
    name: tradeazy-backend

  datasource:
    url: jdbc:mysql://localhost:3306/tradeazy_db?useSSL=false&serverTimezone=Africa/Lagos&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:tradeazy_user}
    password: ${DB_PASSWORD:TradeazyDev@123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:hF3j9aBd7KzXq2YvB1nM8sLpQ4tR6wE9cU0iO5pA3dS7fG2hJ4kL8mN1bV0xC6zW9qY2rT5uI8oP3aS6dF9gH0jK4lM7nB2vC5xZ8}
  expiration-ms: 86400000  # 24 hours

tradeazy:
  upload:
    dir: ${UPLOAD_DIR:./uploads}
  cors:
    allowed-origins: http://localhost:5173
  seed:
    admin:
      username: ${ADMIN_USERNAME:superadmin}
      email: ${ADMIN_EMAIL:admin@tradeazy.test}
      phone: ${ADMIN_PHONE:+2348000000000}
      password: ${ADMIN_PASSWORD:AdminPass123}
      first-name: Tradeazy
      last-name: Admin

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.springframework.security: DEBUG